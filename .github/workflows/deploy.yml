# Pages → Actions → Pages:
# 推送到 main(或手动触发)→ Actions 构建 dist/ → 以 artifact 发布到 GitHub Pages。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限:只读代码 + 写 Pages + OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# 串行部署:排队而非取消,避免旧提交的构建覆盖新站点
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 构建产物校验:dist 缺失或为空立即失败,并记录体积
      - name: Verify build output
        run: |
          test -f dist/index.html
          ls -lh dist
          du -sh dist

      # 官方推荐的 Pages 站点准备步骤
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
